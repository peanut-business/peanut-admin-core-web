name: Web Core release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: web-core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'peanut-business/peanut-admin-core-web'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an annotated release tag on the current main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.([1-9][0-9]*))?$ ]] || {
            echo 'Expected a vX.Y.Z or vX.Y.Z-rc.N tag' >&2
            exit 1
          }
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]] || {
            echo 'Release tag must be annotated' >&2
            exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
          [[ "$tag_commit" == "$main_commit" && "$tag_commit" == "$GITHUB_SHA" ]] || {
            echo 'Release tag must point to the current main commit' >&2
            exit 1
          }
          VERSION="${GITHUB_REF_NAME#v}" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (root.version !== version || root.private !== true) {
            throw new Error('Workspace version or private flag does not match the tag');
          }
          for (const directory of ['client', 'vue', 'ui-vue', 'nuxt', 'uniapp', 'testing']) {
            const pkg = JSON.parse(fs.readFileSync(`packages/${directory}/package.json`, 'utf8'));
            if (pkg.name !== `@peanut-admin/${directory}` || pkg.version !== version || pkg.private) {
              throw new Error(`Package identity differs from the tag: ${directory}`);
            }
            if (pkg.repository?.url !== 'git+https://github.com/peanut-business/peanut-admin-core-web.git'
              || pkg.repository?.directory !== `packages/${directory}`) {
              throw new Error(`Package source is not this repository: ${directory}`);
            }
            for (const [name, required] of Object.entries({...pkg.dependencies, ...pkg.peerDependencies})) {
              if (name.startsWith('@peanut-admin/') && required !== version) {
                throw new Error(`Internal package version differs: ${pkg.name} -> ${name}`);
              }
            }
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Require a fixed successful qualification run
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ vars.CORE_QUALIFICATION_RUN_ID }}
        run: |
          set -Eeuo pipefail
          [[ "$QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Set CORE_QUALIFICATION_RUN_ID to the approved CI run' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/qualification-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo' "$RUNNER_TEMP/qualification-run.json"
          echo "run_id=$QUALIFICATION_RUN" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(jq -r .head_sha "$RUNNER_TEMP/qualification-run.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: web-core-qualified
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualification.outputs.run_id }}
      - name: Verify the exact qualified packages and inputs
        env:
          CORE_QUALIFICATION_COMMIT: ${{ steps.qualification.outputs.source_commit }}
        run: node scripts/release-identity.mjs verify
      - name: Publish six packages in dependency order
        shell: bash
        run: |
          set -Eeuo pipefail
          completed=()
          current='before package processing'
          report_failure() {
            local status="$1"
            if [[ "$status" -ne 0 ]]; then
              echo "Release stopped at: $current" | tee -a "$GITHUB_STEP_SUMMARY" >&2
              if ((${#completed[@]})); then
                printf 'Completed before failure: %s\n' "${completed[@]}" | tee -a "$GITHUB_STEP_SUMMARY" >&2
              else
                echo 'Completed before failure: none' | tee -a "$GITHUB_STEP_SUMMARY" >&2
              fi
            fi
          }
          trap 'report_failure "$?"' EXIT
          lookup_integrity() {
            local package="${1%@*}" version="${1##*@}" status
            local encoded="${package/\//%2f}"
            if ! status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' \
              "https://registry.npmjs.org/$encoded/$version")"; then
              echo "Registry lookup failed for $1" >&2
              return 1
            fi
            if [[ "$status" == 404 ]]; then return 4; fi
            [[ "$status" == 200 ]] || {
              echo "Registry returned HTTP $status for $1" >&2
              return 1
            }
            node -e '
              const p=require(process.argv[1]);
              if (p.name !== process.argv[2] || p.version !== process.argv[3]
                || typeof p.dist?.integrity !== "string" || !p.dist.integrity) {
                throw new Error("Invalid exact-version registry metadata");
              }
              process.stdout.write(p.dist.integrity);
            ' "$RUNNER_TEMP/npm-version.json" "$package" "$version"
          }
          for directory in client vue ui-vue nuxt uniapp testing; do
            name="@peanut-admin/$directory"
            version="${GITHUB_REF_NAME#v}"
            current="$name@$version (qualified package)"
            read -r filename integrity < <(node -e '
              const identity=require("./artifacts/release-identity.json");
              const p=identity.packages.find(p => p.name === process.argv[1] && p.version === process.argv[2]);
              if (!p) throw new Error("Missing qualified package");
              process.stdout.write(`${p.filename} ${p.integrity}\n`);
            ' "$name" "$version")
            [[ -n "$filename" && -n "$integrity" ]] || exit 1
            current="$name@$version (registry lookup)"
            if published="$(lookup_integrity "$name@$version")"; then
              [[ "$published" == "$integrity" ]] || {
                echo "Published $name@$version differs from this tag; refusing to continue" >&2
                exit 1
              }
              node scripts/release-identity.mjs registry "$name" "$RUNNER_TEMP/npm-version.json"
              completed+=("$name@$version $integrity (already matched)")
              echo "Already published with matching integrity: $name@$version $integrity" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            else
              lookup_status=$?
              [[ "$lookup_status" -eq 4 ]] || exit "$lookup_status"
            fi
            current="$name@$version (npm publish)"
            if [[ "$version" == *-rc.* ]]; then
              npm publish "artifacts/$filename" --access public --tag rc --registry=https://registry.npmjs.org/
            else
              npm publish "artifacts/$filename" --access public --registry=https://registry.npmjs.org/
            fi
            completed+=("$name@$version $integrity (published; registry verification pending)")
            current="$name@$version (registry verification)"
            verified=false
            for attempt in {1..30}; do
              if published="$(lookup_integrity "$name@$version")"; then
                [[ "$published" == "$integrity" ]] || {
                  echo "Published $name@$version has different integrity; refusing to continue" >&2
                  exit 1
                }
                node scripts/release-identity.mjs registry "$name" "$RUNNER_TEMP/npm-version.json"
                verified=true
                break
              else
                lookup_status=$?
                [[ "$lookup_status" -eq 4 ]] || exit "$lookup_status"
              fi
              if [[ "$attempt" -lt 30 ]]; then sleep 10; fi
            done
            [[ "$verified" == true ]] || {
              echo "Registry did not expose the published package with matching integrity: $name@$version" >&2
              exit 1
            }
            completed[$((${#completed[@]} - 1))]="$name@$version $integrity (published and verified)"
            echo "Published and verified: $name@$version $integrity" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: web-core-release-verification
          path: |
            artifacts/release-identity.json
            artifacts/build-inputs.json
            artifacts/verification-inputs.json
          if-no-files-found: error
      - name: Publish GitHub Release after registry verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then release_flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease \
            > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            expected_prerelease=false
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then expected_prerelease=true; fi
            jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$expected_prerelease" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
              "$RUNNER_TEMP/release.json" >/dev/null
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${release_flags[@]}" \
            --title "Peanut Admin Web Core $GITHUB_REF_NAME" --generate-notes
